<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Waggy</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>


  <nav class="navbar">
    <a href="index.html" class="logo">🐾 WAGGY DOGS</a>

    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>

    <div class="nav-controls">
      <div class="nav-icons">
        <a href="login.html" class="active" title="Account">👤</a>
        <a href="cart.html" title="Cart">🛒 <span class="cart-badge" id="cart-count">0</span></a>
      </div>
      <button class="menu-toggle" id="mobile-menu-btn" aria-label="Toggle navigation">☰</button>
    </div>
  </nav>

  
  <div class="auth-container">
    <h2 class="section-title">Login</h2>
    <form class="auth-form">
      <div class="form-group">
        <input type="email" placeholder="Email Address" required>
      </div>
      <div class="form-group">
        <input type="password" placeholder="Password" required>
      </div>
      <button type="submit" class="btn-green btn-full">Sign In</button>
     
    </form>
  </div>

  <script>
    const menuBtn = document.getElementById('mobile-menu-btn');
    const navLinks = document.getElementById('nav-links');

    if (menuBtn && navLinks) {
      menuBtn.addEventListener('click', () => {
        navLinks.classList.toggle('active');
      });
    }
  </script>
</body>
</html>
